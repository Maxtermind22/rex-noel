<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦕 La Forêt du Rex Noël - Test</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a120a;
            color: #e8dcc8;
            text-align: center;
            padding: 50px;
        }
        button {
            background: #e64a2a;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.1);
            background: #ff6b4a;
        }
        .status {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #b8a88a;
        }
    </style>
</head>
<body>
    <h1>🦎 Test du Cri du Raptor</h1>
    <p>Clique sur le bouton pour entendre le cri.</p>
    <button id="testRaptorBtn">🔊 Tester le Cri</button>
    <p class="status" id="statusMessage">En attente de test...</p>

    <script>
        let raptorAudio = null;
        const statusMessage = document.getElementById('statusMessage');

        function playRaptorSound() {
            statusMessage.textContent = '🔊 Tentative de lecture...';
            
            try {
                // Utilisation de votre fichier Vocaroo
                if (!raptorAudio) {
                    raptorAudio = new Audio('https://voca.ro/1klPS5JpP4Hi');
                    raptorAudio.volume = 0.8;
                    raptorAudio.onerror = function() {
                        statusMessage.textContent = '❌ Erreur : Le fichier Vocaroo n\'est pas accessible.';
                    };
                }
                
                raptorAudio.currentTime = 0;
                const playPromise = raptorAudio.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        statusMessage.textContent = '✅ Cri joué avec succès !';
                    }).catch(error => {
                        statusMessage.textContent = '⚠️ Bloqué par le navigateur. Essaie de cliquer à nouveau.';
                        console.log('Erreur de lecture:', error);
                        
                        // Son de secours si le fichier Vocaroo échoue
                        try {
                            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            const duration = 0.6;
                            const sampleRate = audioCtx.sampleRate;
                            const bufferSize = sampleRate * duration;
                            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
                            const data = buffer.getChannelData(0);
                            for (let i = 0; i < bufferSize; i++) {
                                const t = i / bufferSize;
                                const envelope = Math.exp(-t * 10) * (1 - Math.exp(-t * 30));
                                const freq = 1800 + 600 * Math.sin(t * 30) + 400 * Math.sin(t * 60);
                                const carrier = Math.sin(2 * Math.PI * freq * t * sampleRate / sampleRate);
                                const noise = (Math.random() * 2 - 1) * 0.3 * (1 - t * 2);
                                data[i] = (carrier * 0.6 + noise) * envelope * 0.5;
                            }
                            const source = audioCtx.createBufferSource();
                            source.buffer = buffer;
                            source.connect(audioCtx.destination);
                            source.start();
                            statusMessage.textContent = '✅ Cri de secours joué (synthétisé)';
                        } catch(e) {
                            statusMessage.textContent = '❌ Aucun son disponible.';
                        }
                    });
                }
            } catch(e) {
                statusMessage.textContent = '❌ Erreur générale: ' + e.message;
            }
        }

        document.getElementById('testRaptorBtn').addEventListener('click', playRaptorSound);
    </script>
</body>
</html>
